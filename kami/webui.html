<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="kami-token" content="{{TOKEN}}">
<meta name="kami-folder" content="{{FOLDER}}">
<title>kami</title>
<script type="module" src="{{MODEL_VIEWER}}"></script>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1f; --dim: #6e6e73; --line: #e3e1dc;
  --accent: #c2410c; --accent-text: #ffffff; --stage: #eceae5; --ok: #15803d; --warn: #b45309;
  --bad: #b91c1c; --field: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141414; --panel: #1e1e1e; --text: #ececec; --dim: #9a9a9a; --line: #2e2e2e;
    --accent: #fb923c; --accent-text: #1a1a1a; --stage: #262626; --ok: #4ade80; --warn: #fbbf24;
    --bad: #f87171; --field: #161616;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
code { font: 13px ui-monospace, "Cascadia Code", Consolas, monospace; background: var(--stage);
       padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 24px; }
h1 { margin: 0; font-size: 20px; letter-spacing: .02em; }
h2 { margin: 0; font-size: 16px; }
h3 { margin: 0; font-size: 14px; font-weight: 600; }
.dim { color: var(--dim); font-size: 13px; }

/* header: the pod, what it is for, what it costs */
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
header .wrap { display: flex; gap: 14px; align-items: center; min-height: 56px; flex-wrap: wrap;
               padding-top: 8px; padding-bottom: 8px; }
.pod { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; flex: 1; min-width: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); flex: none; }
.dot.ready { background: var(--ok); } .dot.busy { background: var(--warn); } .dot.bad { background: var(--bad); }
.mode { font-weight: 600; }
.chip { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; color: var(--dim);
        white-space: nowrap; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--dim); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text);
               font-weight: 600; padding: 8px 16px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { padding: 3px 9px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: #fff; }

/* the three stages */
.stages { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 18px 0 14px; }
.stagetab { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px;
            padding: 10px 14px; cursor: pointer; display: grid; gap: 1px; }
.stagetab b { font-size: 16px; }
.stagetab span { font-size: 13px; color: var(--dim); }
.stagetab[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.stagetab.here span::before { content: "\25CF  "; color: var(--accent); font-size: 10px; vertical-align: 1px; }
.stagetab .tick { color: var(--ok); font-style: normal; font-weight: 700; margin-left: 6px; }

.work { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 14px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.controls { display: grid; gap: 14px; }
.controls form { display: grid; gap: 14px; }
label.field { display: grid; gap: 3px; font-size: 13px; color: var(--dim); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.row label.field { flex: 1; min-width: 96px; }
input[type="number"], input[type="text"], select { width: 100%; padding: 6px 8px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--field); }
textarea { width: 100%; min-height: 84px; resize: vertical; padding: 10px; border-radius: 8px;
           border: 1px solid var(--line); background: var(--field); }
label.check { display: flex; align-items: center; gap: 7px; font-size: 14px; }
.seg { display: flex; gap: 4px; background: var(--stage); border-radius: 9px; padding: 3px; flex-wrap: wrap; }
.seg button { flex: 1; border: 0; background: none; border-radius: 7px; padding: 6px 8px; cursor: pointer;
              color: var(--dim); font-size: 13px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13px; cursor: pointer; }
.chips input { position: absolute; opacity: 0; pointer-events: none; }
.chips label:has(input:checked) { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chips label:has(input:focus-visible) { outline: 2px solid var(--accent); }
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.notice { font-size: 13px; color: var(--dim); min-height: 1.2em; }
.notice.bad { color: var(--bad); }
.blocked { display: grid; gap: 10px; }
.podrow { display: flex; gap: 10px; align-items: center; justify-content: space-between; border: 1px solid var(--line);
          border-radius: 10px; padding: 8px 10px; }
.podrow small { display: block; color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
.boot { font: 12px ui-monospace, "Cascadia Code", Consolas, monospace; background: var(--stage); border-radius: 8px;
        padding: 8px 10px; margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; }
dialog.confirm { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text);
                 padding: 18px; width: min(480px, calc(100vw - 32px)); }
dialog.confirm::backdrop { background: rgba(0,0,0,.55); }
dialog.confirm dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 12px 0; font-size: 14px; }
dialog.confirm dt { color: var(--dim); }
dialog.confirm dd { margin: 0; }
.jobchip { display: inline-flex; align-items: center; gap: 7px; }
#jobs-section { position: fixed; top: 64px; right: max(16px, calc((100vw - 1320px) / 2 + 24px)); z-index: 15;
                width: min(560px, calc(100vw - 32px)); max-height: 70vh; overflow: auto; margin: 0;
                background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
                box-shadow: 0 10px 40px rgba(0,0,0,.35); }
#toasts { position: fixed; right: 16px; bottom: 16px; z-index: 25; display: grid; gap: 8px; width: min(380px, calc(100vw - 32px)); }
.toast { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line);
         border-left: 4px solid var(--ok); border-radius: 10px; padding: 10px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.3); }
.toast.bad { border-left-color: var(--bad); }
.toast span { flex: 1; font-size: 14px; overflow-wrap: anywhere; }
.toast .x { border: 0; background: none; color: var(--dim); cursor: pointer; font-size: 16px; }
.steps { display: flex; gap: 4px; flex-wrap: wrap; }
.steps span { font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--dim); }
.steps span.done { color: var(--ok); border-color: currentColor; }
.frontpick { display: flex; gap: 12px; align-items: center; border: 1.5px dashed var(--line); border-radius: 10px;
             padding: 10px; cursor: pointer; background: var(--stage); }
.frontpick.over { border-color: var(--accent); }
.frontpick img { width: 96px; height: 96px; object-fit: contain; border-radius: 8px; background: #fff; flex: none; }
.frontpick .what { display: grid; gap: 3px; min-width: 0; }
.frontpick .what small { color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
.frontpick .empty { color: var(--dim); text-align: center; width: 100%; padding: 14px 0; }
.extras { display: grid; gap: 8px; }
.sent { display: block; white-space: pre-wrap; padding: 8px 10px; }
.lab { display: flex; align-items: center; gap: 6px; }
.info { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--dim); background: none; color: var(--dim);
        font: italic 600 11px/1 Georgia, "Times New Roman", serif; padding: 0; cursor: pointer; flex: none; }
.info:hover, .info[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.help { display: block; font-size: 12px; color: var(--dim); line-height: 1.4; }
.btn.gear { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; font-size: 13px; }
.formhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.btn.gear svg { width: 16px; height: 16px; }
dialog.settings { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text);
                  padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog.settings::backdrop { background: rgba(0,0,0,.55); }
.dialoghead { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px;
              border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
.dialoghead h2 { font-size: 17px; }
.dialogbody { padding: 18px; display: grid; gap: 14px; }
.dialogfoot { display: flex; justify-content: space-between; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line); }
.group { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 12px; }
.group > h3 { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.group > h3 small { font-weight: 400; color: var(--dim); font-size: 12px; }
.group textarea { min-height: 76px; font-size: 13px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; align-items: start; }
.cmd { display: flex; gap: 8px; align-items: center; justify-content: space-between; }

/* view slots and pictures */
.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.slot { position: relative; aspect-ratio: 1; border: 1.5px dashed var(--line); border-radius: 9px;
        background: var(--stage); display: flex; align-items: center; justify-content: center; text-align: center;
        font-size: 12px; color: var(--dim); cursor: pointer; overflow: hidden; padding: 0; }
.slot.filled { border-style: solid; border-color: var(--accent); }
.slot.over { border-color: var(--accent); color: var(--text); }
.slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slot .tag { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.6); color: #fff;
             font-size: 12px; padding: 1px 0; }
.slot .x { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border: 0; border-radius: 6px;
           background: rgba(0,0,0,.6); color: #fff; cursor: pointer; line-height: 1; }
.drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 16px; text-align: center;
        color: var(--dim); cursor: pointer; background: var(--stage); font-size: 14px; }
.drop.over { border-color: var(--accent); color: var(--text); }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { position: relative; width: 72px; height: 72px; border-radius: 8px; overflow: hidden;
         background: var(--stage); border: 1px solid var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border: 0;
                border-radius: 6px; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; line-height: 1; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.swatch { display: grid; gap: 2px; justify-items: center; font-size: 12px; color: var(--dim); position: relative; }
.swatch input[type="color"] { width: 40px; height: 40px; padding: 0; border: 1px solid var(--line);
                              border-radius: 8px; background: none; cursor: pointer; }
.swatch .x { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border: 0; border-radius: 50%;
             background: var(--dim); color: var(--panel); cursor: pointer; line-height: 1; font-size: 12px; }

/* the stage: what is being made */
.stage { display: grid; gap: 12px; min-width: 0; }
.stage.full { position: fixed; inset: 16px; z-index: 20; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.35);
              grid-template-rows: auto 1fr; }
body.has-full::before { content: ""; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 19; }
.stagehead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.stagehead h2 { overflow-wrap: anywhere; }
.stagehead .grow { margin-left: auto; }
.viewer { position: relative; background: var(--stage); border-radius: 10px; height: min(56vh, 520px); min-height: 280px;
          display: flex; align-items: center; justify-content: center; color: var(--dim); text-align: center;
          padding: 16px; overflow: hidden; }
.stage.full .viewer { height: auto; min-height: 60vh; }
.viewer model-viewer, .viewer > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
model-viewer { --poster-color: transparent; }
.veil { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        background: color-mix(in srgb, var(--stage) 75%, transparent); color: var(--text); z-index: 2; }
.views { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.view { margin: 0; background: var(--stage); border-radius: 10px; overflow: hidden; display: grid; }
.view img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; cursor: zoom-in; }
.view figcaption { display: flex; justify-content: space-between; align-items: center; gap: 6px;
                   padding: 6px 8px; font-size: 13px; }
.strip { display: flex; gap: 8px; flex-wrap: wrap; }
.strip img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: var(--stage); cursor: zoom-in; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.metric { background: var(--stage); border-radius: 9px; padding: 8px 10px; }
.metric small { display: block; color: var(--dim); font-size: 12px; }
.metric b { font-weight: 600; }
.metric b.ok { color: var(--ok); } .metric b.warn { color: var(--warn); }
.slotlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
.slotlist li { display: flex; gap: 8px; align-items: center; }
.slotlist i { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line); flex: none; }
.warns { margin: 0; padding-left: 18px; color: var(--warn); font-size: 13px; }
.next { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; }
.next .grow { flex: 1; min-width: 200px; }
.next a { color: var(--text); }

/* jobs */
section.block { margin: 22px 0; }
.head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.head .dim { overflow-wrap: anywhere; }
.jobs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.job { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center;
       background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.job .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job .state { font-size: 13px; color: var(--dim); white-space: nowrap; }
.job .detail { grid-column: 2 / -1; font-size: 13px; color: var(--dim); overflow-wrap: anywhere; }
.job .detail.bad { color: var(--bad); }
.job .detail a { color: var(--text); }
.job .progress { grid-column: 2 / -1; display: grid; grid-template-columns: 1fr auto; gap: 3px 10px;
                 align-items: center; font-size: 13px; color: var(--dim); }
.job .track { height: 5px; border-radius: 3px; background: var(--stage); overflow: hidden; }
.job .fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .6s ease; }
.job .pct { font-variant-numeric: tabular-nums; }
.job .stagename { grid-column: 1 / -1; }
.job .from { font-size: 12px; color: var(--dim); border: 1px solid var(--line); border-radius: 4px;
             padding: 0 4px; margin-left: 6px; }
.spin { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--warn);
        border-right-color: transparent; animation: spin 1s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } .job .fill { transition: none; } }

/* library */
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.obj { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 0;
       overflow: hidden; cursor: pointer; display: grid; }
.obj:hover { border-color: var(--dim); }
.obj[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.obj .pic { aspect-ratio: 1; background: var(--stage); display: flex; align-items: center; justify-content: center;
            color: var(--dim); font-size: 13px; }
.obj .pic img { width: 100%; height: 100%; object-fit: contain; display: block; }
.obj .cap { padding: 8px 10px 10px; display: grid; gap: 4px; }
.obj .name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badges { display: flex; gap: 4px; flex-wrap: wrap; }
.badge { font-size: 12px; font-weight: 600; color: var(--accent); border: 1px solid currentColor;
         border-radius: 4px; padding: 0 5px; }
.badge.plain { color: var(--dim); font-weight: 400; }
.empty { color: var(--dim); padding: 28px 0; text-align: center; }
.lightbox { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.8); display: flex; align-items: center;
            justify-content: center; cursor: zoom-out; padding: 24px; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }

.meter { display: inline-flex; gap: 6px; align-items: baseline; border: 1px solid var(--line); border-radius: 999px;
         padding: 2px 10px; font-size: 13px; white-space: nowrap; }
.meter small { color: var(--dim); font-size: 12px; }
.meter.warn { border-color: var(--warn); color: var(--warn); }
.models { color: var(--dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.libbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.libbar input[type="search"] { flex: 1; min-width: 180px; max-width: 360px; padding: 6px 10px; border-radius: 8px;
                               border: 1px solid var(--line); background: var(--field); }
.libbar select { width: auto; }
.libbar .count { margin-left: auto; }
.obj { position: relative; }
.obj:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.obj .name { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.obj .hide { position: absolute; top: 6px; right: 6px; border: 0; border-radius: 6px; padding: 2px 8px; font-size: 12px;
             background: rgba(0,0,0,.6); color: #fff; cursor: pointer; opacity: 0; }
.obj:hover .hide, .obj:focus-within .hide, .obj .hide:focus-visible { opacity: 1; }
.obj.hidden-obj { opacity: .55; }
.actionsrow { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.actionsrow label.field { width: 84px; }
.colours { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.colour { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: grid; }
.colour i { height: 44px; display: block; }
.colour div { padding: 6px 8px; display: grid; gap: 1px; font-size: 13px; }
.colour small { color: var(--dim); font-size: 12px; }
.colour .share { height: 4px; background: var(--stage); }
.colour .share b { display: block; height: 100%; background: var(--dim); }
input.changed { border-color: var(--accent); }
@media (max-width: 860px) {
  .wrap { padding: 0 14px; }
  header .wrap { gap: 8px; min-height: 48px; }
  h1 { font-size: 18px; }
  .models, #pod-profile, .meter small { display: none; }
  header h1 { flex: 1; }
  .pod { order: 3; flex-basis: 100%; padding-bottom: 8px; gap: 8px; }
  .pod .mode { white-space: nowrap; }
  .work { grid-template-columns: minmax(0, 1fr); }
  .stagetab span { display: none; }
  .stagetab .tick { margin-left: 2px; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>kami</h1>
    <div class="pod" id="pod" aria-live="polite">
      <span class="dot" id="pod-dot"></span>
      <span class="mode" id="pod-mode">Checking the pod…</span>
      <span class="chip" id="pod-profile" hidden></span>
      <span class="models" id="pod-models"></span>
      <span class="meter" id="pod-cost" hidden></span>
      <span class="meter" id="pod-life" hidden></span>
      <span class="dim" id="pod-meta"></span>
    </div>
    <button type="button" class="btn jobchip" id="jobchip" aria-expanded="false" aria-controls="jobs-section" hidden></button>
    <button type="button" class="btn danger" id="down" hidden>Delete pod</button>
  </div>
</header>

<main class="wrap">
  <nav class="stages" role="tablist" aria-label="Stages">
    <button type="button" class="stagetab" role="tab" data-stage="concept"><b>Concept</b><span></span></button>
    <button type="button" class="stagetab" role="tab" data-stage="views"><b>Views</b><span></span></button>
    <button type="button" class="stagetab" role="tab" data-stage="mesh"><b>Mesh</b><span></span></button>
    <button type="button" class="stagetab" role="tab" data-stage="print"><b>Print</b><span></span></button>
  </nav>

  <div class="work">
    <aside class="panel controls" id="controls"></aside>
    <section class="panel stage" id="stage" aria-live="polite"></section>
  </div>

  <section class="block" id="jobs-section" hidden aria-label="Jobs">
    <div class="head"><h2>Jobs</h2><span class="dim">on the pod: the running one, the queue, the last ones</span>
      <button type="button" class="btn small" id="jobs-close" style="margin-left:auto">Close</button></div>
    <ul class="jobs" id="jobs"></ul>

  <section class="block">

    <div class="libbar">
      <input type="search" id="lib-find" placeholder="Find an object" aria-label="Find an object">
      <select id="lib-show" aria-label="Which objects">
        <option value="all">All</option><option value="nomesh">Without a mesh</option>
        <option value="mesh">With a mesh</option><option value="print">With a 3MF</option>
      </select>
      <select id="lib-order" aria-label="Order">
        <option value="new">Newest first</option><option value="name">By name</option>
      </select>
      <label class="check"><input type="checkbox" id="lib-hidden"> Hidden</label>
      <span class="dim count" id="lib-count"></span>
    </div>
    <div class="grid" id="library"><p class="empty">Loading…</p></div>
  </section>
</main>

<div id="toasts" aria-live="polite"></div>
<script>
"use strict";
const TOKEN = document.querySelector('meta[name="kami-token"]').content;
const FOLDER = document.querySelector('meta[name="kami-folder"]').content;
const VIEW_ORDER = ["front", "left", "back", "right", "front-left", "front-right", "back-left", "back-right"];
const STAGES = ["concept", "views", "mesh", "print"];

// what the pod adds to a concept's front picture when it reports none of its own
const FRONT_DEFAULT = "front view of the whole object, centred, full view, on a plain white background, soft even studio light";
// the page remembers how you left it, in this browser
const store = {
  get(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem("kami." + key)); return v == null ? fallback : v; }
    catch (e) { return fallback; }
  },
  set(key, value) { try { localStorage.setItem("kami." + key, JSON.stringify(value)); } catch (e) {} },
  drop(key) { try { localStorage.removeItem("kami." + key); } catch (e) {} },
};

let pod = null;              // the last /api/state pod info
let hintText = "", hintColors = 4;       // kami.toml's printing hint, and its colours
let presets = [], presetName = null;     // the kinds of print kami has a hint for; the one in force (null: kami.toml's own text)
// the printing hint before any rewriting: the chosen preset's, or kami.toml's
function chosenPreset() { return concept.preset || presetName || "toml"; }
function baseHint() {
  const found = presets.find(x => x.name === chosenPreset());
  return found ? found.text : hintText;
}
// Whether this pod's image model heeds a negative prompt. Pods that say so are believed;
// older ones are judged by their defaults (no guidance, or FLUX.2: it does not).
function readsNegative() {
  const s = served();
  if (typeof s.image_negative === "boolean") return s.image_negative;
  const g = (s.image_defaults || {}).guidance;
  return !!s.image_model && !/flux|turbo/i.test(s.image_model) && (g == null || g > 1);
}
function baseNegative() {
  const found = presets.find(x => x.name === chosenPreset());
  return (found && found.negative) || "";
}
let concept = store.get("concept", {});
let draft = "";              // the description being typed: it survives the form being redrawn
let ownFront = null;         // a front picture of yours, given in "From image": {name, data, url}
let takeFront = null;        // gives one to the Concept form when it is open on "From image"  // {forPrint, colors, hint, frontHint, angles, count}
let objects = [], signature = "";
let stage = null, picked = false;        // picked: the user chose a stage, stop following the pod
let current = null;          // key of the object on the stage
let meshMode = "views";      // views | each | text
const slots = {};            // view -> {file} (library) or {name, data, url} (uploaded)
const loose = [];            // pictures for "one mesh per picture"
const PRINT_DEFAULTS = {height: 80, fit: "longest", base: 2, mode: "auto", colors: 4, palette: [], rebuild: "auto", detail: 0.3,
                        smoothing: 3, minPatch: 1, keep: false};
const print = Object.assign({}, PRINT_DEFAULTS, store.get("print", {}),
                            {result: null, busy: false, dirty: false, error: "", forFile: null});
function rememberPrint() {
  const kept = {};
  for (const key of Object.keys(PRINT_DEFAULTS)) kept[key] = print[key];
  store.set("print", kept);
}
let controlsKey = "", stageKey = "";
const doneJobs = new Set();

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v === true) node.setAttribute(k, "");
    else node.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) node.append(kid);
  return node;
}
const fileUrl = rel => "files/" + rel.split("/").map(encodeURIComponent).join("/");
function money(x) { return typeof x === "number" ? "$" + x.toFixed(2) : "?"; }
function minutes(s) {
  s = Math.max(0, Math.round(s));
  if (s < 3600) return Math.round(s / 60) + " min";
  return Math.floor(s / 3600) + " h " + String(Math.round((s % 3600) / 60)).padStart(2, "0") + " min";
}
function size(n) { return n >= 1e5 ? (n / 1e6).toFixed(1) + " MB" : Math.round(n / 1e3) + " kB"; }
async function post(path, body) {
  const r = await fetch(path, {method: "POST", body: JSON.stringify(body),
                               headers: {"Content-Type": "application/json", "X-Kami-Token": TOKEN}});
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}
function copyButton(text) {
  const b = el("button", {type: "button", class: "btn small", text: "Copy"});
  b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(text); b.textContent = "Copied"; }
    catch (e) { b.textContent = "Select it"; }
    setTimeout(() => { b.textContent = "Copy"; }, 1500);
  });
  return b;
}
const command = text => el("div", {class: "cmd"}, el("code", {text}), copyButton(text));

/* --- the pod, and what it is for --- */
function served() { return (pod && pod.served) || {}; }
function ready() { return !!(pod && pod.pod && pod.ready); }
function can(name) {
  const s = served();
  if (name === "print") return true;
  if (!ready()) return false;
  if (name === "mesh") return !!s.mesh_model;
  if (name === "views") return !!s.views_model;
  return !!(s.image_model || (s.views_model && s.views_from_prompt));      // concept: pictures from text
}
function podMode() {
  const made = ["concept", "views", "mesh"].filter(can);
  if (!made.length) return "Pod";
  const text = made.join(" + ") + " pod";
  return text[0].toUpperCase() + text.slice(1);
}
function obj() { return objects.find(o => o.key === current) || null; }
function meshOf(o) { return o && o.meshes.length ? o.meshes[0] : null; }
function frontOf(o) { return o ? (o.views.front || o.images[0] || Object.values(o.views)[0] || null) : null; }

function renderPod() {
  const dot = $("#pod-dot"), mode = $("#pod-mode"), meta = $("#pod-meta"), down = $("#down"), prof = $("#pod-profile");
  dot.className = "dot";
  meta.textContent = "";
  $("#pod-models").textContent = "";
  $("#pod-cost").hidden = $("#pod-life").hidden = true;
  down.hidden = true;
  prof.hidden = true;
  const p = pod && pod.pod;
  if (!pod) { mode.textContent = "Checking the pod…"; return; }
  if (pod.error && !p) { dot.classList.add("bad"); mode.textContent = "Cannot read the pod: " + pod.error; return; }
  const st = pod.starting;
  if (!p) {
    if (st && st.running) {
      dot.classList.add("busy");
      mode.textContent = "Starting " + st.profile + "\u2026";
      meta.textContent = pod.waiting ? "waiting for a GPU with stock: nothing is billing yet" : "asking for a GPU";
      down.hidden = false;
      return;
    }
    mode.textContent = pod.waiting ? "Waiting for GPU stock (kami up)" : "No pod";
    meta.textContent = pod.waiting ? "" : "nothing is billing";
    if (pod.waiting) dot.classList.add("busy");
    return;
  }
  down.hidden = false;
  if (p.status === "GONE") { dot.classList.add("bad"); mode.textContent = "The pod no longer exists"; return; }
  dot.classList.add(pod.ready ? "ready" : "busy");
  mode.textContent = pod.ready ? podMode() : "Pod starting";
  prof.hidden = false;
  prof.textContent = p.profile || "pod";
  const s = served();
  const models = [s.image_model, s.views_model, s.mesh_model].filter(Boolean).map(m => m.split("/").pop());
  $("#pod-models").textContent = [models.join(" + "), p.gpu].filter(Boolean).join(" \u00b7 ");
  // the two things to keep an eye on: what it costs, and how long until the guard deletes it
  const cost = $("#pod-cost"), life = $("#pod-life");
  if (typeof p.cost_per_hour === "number") {
    cost.hidden = false;
    cost.replaceChildren(typeof p.session_cost_estimate === "number" ? "\u2248 " + money(p.session_cost_estimate) : "",
                         el("small", {text: money(p.cost_per_hour) + "/h"}));
    cost.title = "Spent so far (an estimate), and the price per hour";
  }
  const g = p.guard || {};
  if (g.deadline) {
    const left = g.deadline - Date.now() / 1000;
    life.hidden = false;
    life.classList.toggle("warn", left < 30 * 60);
    life.replaceChildren(minutes(left), el("small", {text: g.idle_minutes ? "left \u00b7 or " + g.idle_minutes + " min idle" : "left"}));
    life.title = "The guard deletes the pod then, or sooner after that long without jobs";
  }
}

let armedAt = 0;
$("#down").addEventListener("click", async () => {
  const b = $("#down");
  if (Date.now() - armedAt > 4000) {          // two clicks: no browser dialog
    armedAt = Date.now();
    b.classList.add("armed");
    b.textContent = "Click again to delete it";
    setTimeout(() => { if (Date.now() - armedAt >= 4000) { b.classList.remove("armed"); b.textContent = "Delete pod"; } }, 4100);
    return;
  }
  armedAt = 0;
  b.disabled = true;
  b.textContent = "Deleting…";
  try {
    const r = await post("api/down", {});
    $("#pod-mode").textContent = "Pod " + (r.pod_id || "") + " deleted" +
      (typeof r.session_cost_estimate === "number" ? " · ≈ " + money(r.session_cost_estimate) + " this session" : "");
  } catch (e) {
    $("#pod-meta").textContent = "Could not delete it: " + e.message + " (kami down in a terminal)";
  }
  b.disabled = false;
  b.classList.remove("armed");
  b.textContent = "Delete pod";
  refresh();
});

/* --- stages --- */
function followPod() {
  // open on what the pod is for; with no pod, on the library's last mesh ready to print
  if (picked) return;
  const want = can("concept") ? "concept" : can("views") ? "views" : can("mesh") ? "mesh" : (stage || "print");
  if (want !== stage) setStage(want, false);
}
function setStage(name, byUser) {
  stage = name;
  if (byUser) picked = true;
  if (name === "print") queuePrint();
  render();
}
// What the object on the stage already has, stage by stage: green ticks are for that alone.
function doneFor(o, name) {
  if (!o) return false;
  if (name === "concept") return !!frontOf(o);
  if (name === "views") return Object.keys(o.views).filter(v => v !== "front").length > 0;
  if (name === "mesh") return !!meshOf(o);
  return o.prints.length > 0;
}
function renderStages() {
  const o = obj();
  for (const tab of $$(".stagetab")) {
    const name = tab.dataset.stage, here = can(name), done = doneFor(o, name);
    tab.setAttribute("aria-selected", String(name === stage));
    tab.tabIndex = name === stage ? 0 : -1;
    tab.classList.toggle("here", here);
    $("span", tab).textContent = name === "print" ? "on this PC, no pod"
      : here ? "on this pod" : ready() ? "needs another pod" : "needs a pod";
    let tick = $(".tick", tab);
    if (done && !tick) $("b", tab).append(tick = el("i", {class: "tick", "aria-hidden": "true", text: "\u2713"}));
    if (!done && tick) tick.remove();
    tab.title = done ? "Done for " + o.name : "";
    tab.setAttribute("aria-label", tab.dataset.stage[0].toUpperCase() + tab.dataset.stage.slice(1) + ", " + $("span", tab).textContent + (done ? ", done for this object" : ""));
  }
}
$$(".stagetab").forEach(t => t.addEventListener("click", () => setStage(t.dataset.stage, true)));
// a tab list: the arrows, Home and End move between stages
$(".stages").addEventListener("keydown", e => {
  const tabs = $$(".stagetab"), at = tabs.indexOf(document.activeElement);
  if (at < 0) return;
  const to = {ArrowRight: at + 1, ArrowLeft: at - 1, Home: 0, End: tabs.length - 1}[e.key];
  if (to == null) return;
  e.preventDefault();
  const tab = tabs[(to + tabs.length) % tabs.length];
  tab.focus();
  setStage(tab.dataset.stage, true);
});

/* why a stage cannot make anything right now, and the way out: start or switch to a pod
   that can, after its price is shown, or the same from a terminal */
function blocked(name) {
  const p = pod && pod.pod, st = pod && pod.starting;
  const what = {mesh: "meshes", views: "views", concept: "pictures from text"}[name];
  const box = el("div", {class: "blocked"});
  if (st && st.running) return booting(box, st);
  if (p && !pod.ready) {
    box.append(el("p", {class: "dim", text: "The pod is starting. This unlocks when it is ready."}));
    if (st) box.append(el("pre", {class: "boot", text: st.log.join("\n")}));
    else box.append(command("kami status"));
    return box;
  }
  const fitting = ((pod && pod.profiles) || []).filter(x => x[name]);
  box.append(el("p", {text: p ? "The active pod (" + (p.profile || "pod") + ") does not make " + what + "."
                               : "No pod is running, so nothing is billing."}));
  if (st && !st.running && st.code) {
    box.append(el("p", {class: "notice bad", text: st.profile + " did not start (kami up ended with " + st.code + "):"}),
               el("pre", {class: "boot", text: st.log.join("\n")}));
  }
  if (fitting.length) {
    box.append(el("p", {class: "dim", text: p ? "Switch to a pod that does (the active one is deleted first):"
                                              : "Start a pod that makes " + what + ":"}));
    fitting.slice(0, 4).forEach(x => box.append(el("div", {class: "podrow"},
      el("div", {}, el("b", {text: x.name}), el("small", {text: x.models || ""})),
      el("button", {type: "button", class: "btn primary small", text: p ? "Switch" : "Start", onclick: e => askStart(x.name, e.target)}))));
    const terminal = el("details", {}, el("summary", {class: "dim", text: "Or in a terminal"}));
    fitting.slice(0, 4).forEach(x => terminal.append(command((p ? "kami down; " : "") + "kami up -p " + x.name)));
    box.append(terminal);
  } else box.append(command(name === "mesh" ? "kami up -p mesh" : "kami up -p views"));
  if (name === "views" && !p) box.append(el("p", {class: "dim", text: "A picture of the front of your own needs no Concept pod: only this one, to turn it."}));
  box.append(el("p", {class: "dim", text: "The library below and the Print stage work without a pod."}));
  return box;
}
function booting(box, st) {
  const since = Math.max(0, Math.round(Date.now() / 1000 - st.since));
  box.append(el("p", {}, el("span", {class: "spin", style: "display:inline-block;margin-right:8px"}),
                "Starting " + st.profile + " \u00b7 " + minutes(since)),
             el("pre", {class: "boot", text: st.log.length ? st.log.join("\n") : "kami up is starting\u2026"}),
             el("p", {class: "dim", text: "It bills from the moment it has a GPU. This stage opens by itself when it is ready."}),
             el("button", {type: "button", class: "btn danger small", text: "Stop and delete it", onclick: async e => {
               e.target.disabled = true;
               try { await post("api/down", {}); } catch (err) { e.target.textContent = err.message; }
               refresh();
             }}));
  return box;
}
// The price first, then a yes: the only way the page spends money.
async function askStart(name, button) {
  const label = button.textContent;
  button.disabled = true;
  button.textContent = "Pricing\u2026";
  let q;
  try { q = await post("api/quote", {profile: name}); }
  catch (e) { button.textContent = e.message; setTimeout(() => { button.textContent = label; button.disabled = false; }, 4000); return; }
  button.textContent = label;
  button.disabled = false;
  const rows = [
    ["Models", q.models || "?"],
    ["GPU", q.gpu ? q.gpu + " \u00b7 " + money(q.hourly) + "/h" : "none in stock now: it waits for one, billing nothing while it waits"],
    ["Boot", (q.boot_seconds ? "about " + minutes(q.boot_seconds) : "several minutes") + ", billed"
             + (q.download_gb ? " (" + q.download_gb + " GB of weights)" : "")],
    ["Guard", "deletes it after " + q.max_hours + " h, or " + q.idle_minutes + " min without jobs"],
  ];
  if (q.replaces) rows.push(["First", "deletes the active pod, " + q.replaces + (q.replaces_cost != null ? " (\u2248 " + money(q.replaces_cost) + " so far)" : "")]);
  const dialog = el("dialog", {class: "confirm", "aria-label": "Start " + name});
  const go = el("button", {type: "button", class: "btn primary", text: (q.replaces ? "Delete " + q.replaces + " and start " : "Start ") + name});
  dialog.append(el("h2", {text: "Start " + name + "?"}),
    el("dl", {}, rows.map(([k, v]) => [el("dt", {text: k}), el("dd", {text: v})])),
    el("div", {class: "actions", style: "justify-content:flex-end"},
       el("button", {type: "button", class: "btn", text: "Cancel", onclick: () => dialog.close()}), go));
  dialog.addEventListener("close", () => dialog.remove());
  go.addEventListener("click", async () => {
    go.disabled = true;
    go.textContent = "Starting\u2026";
    try { await post("api/switch", {profile: name, confirm: true}); dialog.close(); picked = false; }
    catch (e) { go.textContent = e.message; return; }
    controlsKey = ""; refresh();
  });
  document.body.append(dialog);
  dialog.showModal();
}

/* --- pictures: reading, slots --- */
const IMAGE_NAME = /\.(png|jpe?g|webp|avif|heic|heif|tiff?|bmp|gif)$/i;
const IMAGE_TYPE = /^image\/(png|jpeg|webp|avif|heic|heif|tiff|bmp|gif)$/;
function readPicture(file) {
  return new Promise((done, fail) => {
    if (!IMAGE_NAME.test(file.name) && !IMAGE_TYPE.test(file.type)) return fail(new Error(file.name + " is not a picture"));
    const reader = new FileReader();
    reader.onload = () => done({
      name: IMAGE_NAME.test(file.name) ? file.name : "pasted." + (file.type.split("/")[1] || "png").replace("jpeg", "jpg"),
      data: String(reader.result).split(",")[1], url: URL.createObjectURL(file)});
    reader.onerror = () => fail(new Error("Could not read " + file.name));
    reader.readAsDataURL(file);
  });
}
function pictureBody(p) { return p.file ? {file: p.file} : {name: p.name, data: p.data}; }
function pictureUrl(p) { return p.file ? fileUrl(p.file) : p.url; }
function slotNames() {
  const s = served(), most = s.max_views || 1;
  if (most < 2) return ["front"];
  const names = s.view_names && s.view_names.length ? s.view_names : VIEW_ORDER;
  return VIEW_ORDER.filter(n => names.includes(n)).concat(names.filter(n => !VIEW_ORDER.includes(n))).slice(0, most);
}
function fillSlots(o) {
  for (const k of Object.keys(slots)) delete slots[k];
  if (!o) return renderSlots();
  for (const [view, file] of Object.entries(o.views)) slots[view] = {file};
  if (!slots.front && o.images[0]) slots.front = {file: o.images[0]};
  renderSlots();
}
function pickFile(multiple, then) {
  const input = el("input", {type: "file", accept: ".png,.jpg,.jpeg,.webp,.avif,.heic,.heif,.tif,.tiff,.bmp,.gif",
                             multiple: multiple});
  input.addEventListener("change", async () => {
    for (const f of input.files) { try { then(await readPicture(f)); } catch (e) {} }
  });
  input.click();
}
function renderSlots() {
  const box = $("#slots");
  if (!box) return;
  box.innerHTML = "";
  for (const name of slotNames()) {
    const p = slots[name];
    const slot = el("div", {class: "slot" + (p ? " filled" : ""), role: "button", tabindex: "0",
                            title: p ? "Replace the " + name + " view" : "Add the " + name + " view"});
    const put = pic => { slots[name] = pic; renderSlots(); };
    slot.addEventListener("click", e => { if (!e.target.closest(".x")) pickFile(false, put); });
    slot.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pickFile(false, put); } });
    slot.addEventListener("dragover", e => { e.preventDefault(); slot.classList.add("over"); });
    slot.addEventListener("dragleave", () => slot.classList.remove("over"));
    slot.addEventListener("drop", async e => {
      e.preventDefault(); slot.classList.remove("over");
      if (e.dataTransfer.files[0]) { try { put(await readPicture(e.dataTransfer.files[0])); } catch (err) {} }
    });
    if (p) {
      const img = el("img", {src: pictureUrl(p), alt: name + " view"});
      slot.append(img, el("button", {type: "button", class: "x", "aria-label": "Remove the " + name + " view", text: "×",
                                     onclick: () => { delete slots[name]; renderSlots(); }}));
    }
    slot.append(el("span", {class: "tag", text: name}));
    if (!p) slot.prepend("+");
    box.append(slot);
  }
  const count = slotNames().filter(n => slots[n]).length, button = $("#mesh-go");
  if (button && meshMode === "views") button.textContent = count > 1 ? "Make mesh from " + count + " views" : "Make mesh";
}
function renderLoose() {
  const box = $("#loose");
  if (!box) return;
  box.innerHTML = "";
  loose.forEach((p, i) => box.append(el("div", {class: "thumb", title: p.name},
    el("img", {src: p.url, alt: p.name}),
    el("button", {type: "button", "aria-label": "Remove " + p.name, text: "×",
                  onclick: () => { URL.revokeObjectURL(p.url); loose.splice(i, 1); renderLoose(); }}))));
  const button = $("#mesh-go");
  if (button && meshMode === "each") button.textContent = loose.length > 1 ? "Make " + loose.length + " meshes" : "Make mesh";
}

/* --- controls shared by forms --- */
function info(help) {
  const button = el("button", {type: "button", class: "info", "aria-label": "What is this?", "aria-expanded": "false", title: help, text: "i"});
  button.addEventListener("click", e => {
    e.preventDefault();                      // inside a label: do not focus the field
    const note = button.closest("label, .helped").querySelector(".help");
    note.hidden = !note.hidden;
    button.setAttribute("aria-expanded", String(!note.hidden));
  });
  return button;
}

function viewer(src, alt, size) {

  shown.addEventListener("load", () => {

        // where the object is on its way to a print, a stage each
        el("div", {class: "steps", "aria-label": STAGES.filter(n => doneFor(o, n)).join(", ") || "nothing yet"},
          [["concept", "front"], ["views", views > 1 ? (views - 1) + (views > 2 ? " sides" : " side") : "sides"],
           ["mesh", "mesh"], ["print", "3MF"]].map(([n, t]) =>
            el("span", {class: doneFor(o, n) ? "done" : "", text: (doneFor(o, n) ? "\u2713 " : "") + t}))),
        o.folder ? el("small", {class: "dim", text: o.folder}) : null));
    card.addEventListener("click", () => select(o.key, true));
    card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(o.key, true); } });
    box.append(card);
  }
}
function select(key, byUser) {
  current = key;
  const o = obj();
  fillSlots(o);
  if (byUser && o) {
    picked = true;
    const turned = Object.keys(o.views).length > 1;
    if (meshOf(o)) { if (stage === "concept" || stage === "views") stage = "mesh"; }
    else if (stage === "print" || (stage === "mesh" && !can("mesh"))) stage = turned ? "views" : "concept";
    else if (stage === "concept" && turned) stage = "views";
    window.scrollTo({top: 0, behavior: "smooth"});
  }
  if (stage === "print") queuePrint();
  render();
}
function render() {
  if (!stage) return;
  renderStages();
  renderControls();
  renderStage();
  $$(".obj").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.key === current)));
}
function lightbox(file) {
  const box = el("div", {class: "lightbox", role: "dialog", "aria-label": file}, el("img", {src: fileUrl(file), alt: file}));
  box.addEventListener("click", () => box.remove());
  document.body.append(box);
}
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  $$(".lightbox").forEach(b => b.remove());
  if ($("#stage").classList.contains("full")) {
    $("#stage").classList.remove("full");
    document.body.classList.remove("has-full");
    stageKey = ""; renderStage();
  }
});
document.addEventListener("paste", async e => {
  if (stage === "views" && takeFront && can("views")) {            // the pasted picture is the front to turn
    const file = [...(e.clipboardData || {}).items || []].filter(i => i.kind === "file").map(i => i.getAsFile())[0];
    if (file) { try { takeFront(await readPicture(file)); } catch (err) {} }
    return;
  }
  if (stage !== "mesh" || !can("mesh")) return;
  const files = [...(e.clipboardData || {}).items || []].filter(i => i.kind === "file").map(i => i.getAsFile());
  for (const f of files) {
    try {
      const pic = await readPicture(f);
      if (meshMode === "views") { slots[slotNames().find(n => !slots[n]) || "front"] = pic; renderSlots(); }
      else if (meshMode === "each") { loose.push(pic); renderLoose(); }
    } catch (err) {}
  }
});

/* --- jobs --- */
const STATE_TEXT = {sending: "sending", queued: "queued", running: "on the GPU",
                    downloading: "downloading", done: "done", error: "failed"};
function objectOfFile(file) {
  return objects.find(o => Object.values(o.views).includes(file) || o.images.includes(file) ||
                           o.meshes.some(m => m.file === file) || o.prints.some(p => p.file === file));
}
function renderJobs(list) {
  const chip = $("#jobchip"), running = list.filter(j => !["done", "error"].includes(j.status));
  chip.hidden = !list.length;
  if (!list.length) $("#jobs-section").hidden = true;
  chip.innerHTML = "";
  const busy = running.find(j => j.status === "running") || running[0];
  if (busy) {
    const pct = typeof busy.progress === "number" ? " \u00b7 " + Math.round(busy.progress * 100) + "%" : "";
    chip.append(el("span", {class: "spin"}), running.length + (running.length > 1 ? " jobs" : " job") + pct);
  } else chip.append("Jobs");
  chip.title = busy ? busy.label : "The last jobs";
  const ul = $("#jobs");
  ul.innerHTML = "";
  for (const j of list) {
    const li = el("li", {class: "job"});
    const mark = el("span", {class: j.status === "done" ? "dot ready" : j.status === "error" ? "dot bad" : "spin"});
    const label = el("span", {class: "label", text: j.label, title: j.label});
    if (j.external) label.append(el("span", {class: "from", text: "terminal",
      title: "Sent from a terminal or another kami ui; that one downloads its files"}));
    let text = STATE_TEXT[j.status] || j.status;
    if (j.status === "queued" && j.position) text += " #" + j.position;
    const end = j.finished || Date.now() / 1000;
    li.append(mark, label, el("span", {class: "state", text: text + (j.created ? " · " + Math.max(0, Math.round(end - j.created)) + " s" : "")}));
    if (j.status === "running" && typeof j.progress === "number") {
      const pct = Math.round(Math.min(1, Math.max(0, j.progress)) * 100);
      li.append(el("div", {class: "progress"},
        el("div", {class: "track", role: "progressbar", "aria-valuenow": String(pct), "aria-valuemin": "0", "aria-valuemax": "100"},
           el("div", {class: "fill", style: "width:" + pct + "%"})),
        el("span", {class: "pct", text: pct + "%"}),
        el("span", {class: "stagename", text: (j.stage_label || "On the GPU") + (j.steps ? " · step " + j.step + "/" + j.steps : "")})));
    }
    const local = (j.files || []).filter(f => objectOfFile(f));
    if (j.error) li.append(el("span", {class: "detail bad", text: j.error}));
    else if (local.length) {
      const detail = el("span", {class: "detail"});
      local.forEach((f, i) => {
        if (i) detail.append(", ");
        detail.append(el("a", {href: fileUrl(f), text: f, title: "Put it on the stage",
          onclick: e => { e.preventDefault(); const o = objectOfFile(f); if (o) select(o.key, true); }}));
      });
      li.append(detail);
    }
    ul.append(li);
  }
}
function followJobs(list) {
  for (const j of list) {
    if (j.external || doneJobs.has(j.id)) continue;
    if (j.status === "error") { doneJobs.add(j.id); toast(j.label + " failed: " + (j.error || "see the jobs"), true); continue; }
    if (j.status !== "done" || !(j.files || []).length) continue;
    const o = objectOfFile(j.files.find(f => /\.glb$/i.test(f)) || j.files[0]);
    if (!o) continue;                 // the library has not caught up yet: next round
    doneJobs.add(j.id);
    const where = j.kind === "views" ? "views" : j.kind === "image" ? "concept" : "mesh";
    toast(j.label + " is ready", false, ["Show", () => { select(o.key, false); setStage(where, true); }]);
  }
}

$("#jobchip").addEventListener("click", () => {
  const box = $("#jobs-section");
  box.hidden = !box.hidden;
  $("#jobchip").setAttribute("aria-expanded", String(!box.hidden));
});
$("#jobs-close").addEventListener("click", () => { $("#jobs-section").hidden = true; $("#jobchip").setAttribute("aria-expanded", "false"); });

/* A finished job says so, and waits to be looked at: the page does not move under you. */
function toast(text, bad, action) {
  const box = el("div", {class: "toast" + (bad ? " bad" : ""), role: "status"}, el("span", {text}),
    action ? el("button", {type: "button", class: "btn small", text: action[0], onclick: () => { action[1](); box.remove(); }}) : null,
    el("button", {type: "button", class: "x", "aria-label": "Dismiss", text: "×", onclick: () => box.remove()}));
  $("#toasts").append(box);
  setTimeout(() => box.remove(), 20000);
}

for (const [id, key, read] of [["#lib-find", "find", e => e.value], ["#lib-show", "show", e => e.value],
                               ["#lib-order", "order", e => e.value], ["#lib-hidden", "hidden", e => e.checked]]) {
  const input = $(id);
  if (key === "hidden") input.checked = lib.hidden; else input.value = lib[key];
  input.addEventListener(key === "find" ? "input" : "change", () => {
    lib[key] = read(input);
    store.set("library", Object.assign({}, lib, {find: ""}));      // a search is not kept
    renderLibrary();
  });
}
lib.find = "";

/* --- polling --- */
async function refreshObjects(force) {
  const r = await fetch("api/objects", {cache: "no-store"});
  if (!r.ok) return;
  const data = await r.json();
  objects = data.objects || [];
  signature = data.signature;
  if (current && !obj()) current = null;
  if (!current && objects.length) {
    // the newest thing made that the open stage can show
    const first = (stage === "print" ? objects.find(o => meshOf(o)) : null) || objects[0];
    current = first.key;
    fillSlots(first);
    if (stage === "print") queuePrint();
  }
  renderLibrary();
  render();
}
let busy = false, first = true;
async function refresh() {
  if (busy) return;
  busy = true;
  try {
    const r = await fetch("api/state", {cache: "no-store"});
    if (r.ok) {
      const s = await r.json();
      pod = s.pod;
      hintText = s.print_hint_text || "";
      presets = s.print_presets || [];
      presetName = s.print_preset || null;
      hintColors = s.print_colors || 4;
      if (first) { if (!store.get("print", null)) print.colors = hintColors; first = false; }
      renderPod();
      followPod();
      if (!stage) setStage("print", false);
      if (s.signature !== signature) await refreshObjects();
      renderJobs(s.jobs || []);
      followJobs(s.jobs || []);
      render();
    }
  } catch (e) {
    $("#pod-mode").textContent = "kami ui stopped (run it again in a terminal)";
    $("#pod-dot").className = "dot bad";
  } finally {
    busy = false;
  }
}
refresh();
setInterval(refresh, 3000);
</script>
