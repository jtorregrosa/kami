<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="kami-token" content="{{TOKEN}}">
<meta name="kami-folder" content="{{FOLDER}}">
<title>kami</title>
<script type="module" src="{{MODEL_VIEWER}}"></script>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1f; --dim: #6e6e73; --line: #e3e1dc;
  --accent: #c2410c; --accent-text: #ffffff; --stage: #eceae5; --ok: #15803d; --warn: #b45309;
  --bad: #b91c1c; --field: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141414; --panel: #1e1e1e; --text: #ececec; --dim: #9a9a9a; --line: #2e2e2e;
    --accent: #fb923c; --accent-text: #1a1a1a; --stage: #262626; --ok: #4ade80; --warn: #fbbf24;
    --bad: #f87171; --field: #161616;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
code { font: 13px ui-monospace, "Cascadia Code", Consolas, monospace; background: var(--stage);
       padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 24px; }
h1 { margin: 0; font-size: 20px; letter-spacing: .02em; }
h2 { margin: 0; font-size: 16px; }
h3 { margin: 0; font-size: 14px; font-weight: 600; }
.dim { color: var(--dim); font-size: 13px; }

/* header: the pod, what it is for, what it costs */
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
header .wrap { display: flex; gap: 14px; align-items: center; min-height: 56px; flex-wrap: wrap;
               padding-top: 8px; padding-bottom: 8px; }
.pod { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; flex: 1; min-width: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); flex: none; }
.dot.ready { background: var(--ok); } .dot.busy { background: var(--warn); } .dot.bad { background: var(--bad); }
.mode { font-weight: 600; }
.chip { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; color: var(--dim);
        white-space: nowrap; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--dim); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text);
               font-weight: 600; padding: 8px 16px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { padding: 3px 9px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: #fff; }

/* the three stages */
.stages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 18px 0 14px; }
.stagetab { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px;
            padding: 10px 14px; cursor: pointer; display: grid; gap: 1px; }
.stagetab b { font-size: 16px; }
.stagetab span { font-size: 13px; color: var(--dim); }
.stagetab[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.stagetab.here span { color: var(--ok); }

.work { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 14px; align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.controls { display: grid; gap: 14px; }
.controls form { display: grid; gap: 14px; }
label.field { display: grid; gap: 3px; font-size: 13px; color: var(--dim); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.row label.field { flex: 1; min-width: 96px; }
input[type="number"], input[type="text"], select { width: 100%; padding: 6px 8px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--field); }
textarea { width: 100%; min-height: 84px; resize: vertical; padding: 10px; border-radius: 8px;
           border: 1px solid var(--line); background: var(--field); }
label.check { display: flex; align-items: center; gap: 7px; font-size: 14px; }
.seg { display: flex; gap: 4px; background: var(--stage); border-radius: 9px; padding: 3px; flex-wrap: wrap; }
.seg button { flex: 1; border: 0; background: none; border-radius: 7px; padding: 6px 8px; cursor: pointer;
              color: var(--dim); font-size: 13px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13px; cursor: pointer; }
.chips input { position: absolute; opacity: 0; pointer-events: none; }
.chips label:has(input:checked) { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chips label:has(input:focus-visible) { outline: 2px solid var(--accent); }
details summary { cursor: pointer; color: var(--dim); font-size: 13px; }
details .row { margin-top: 10px; }
.actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.notice { font-size: 13px; color: var(--dim); min-height: 1.2em; }
.notice.bad { color: var(--bad); }
.blocked { display: grid; gap: 10px; }
.cmd { display: flex; gap: 8px; align-items: center; justify-content: space-between; }

/* view slots and pictures */
.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.slot { position: relative; aspect-ratio: 1; border: 1.5px dashed var(--line); border-radius: 9px;
        background: var(--stage); display: flex; align-items: center; justify-content: center; text-align: center;
        font-size: 12px; color: var(--dim); cursor: pointer; overflow: hidden; padding: 0; }
.slot.filled { border-style: solid; border-color: var(--accent); }
.slot.over { border-color: var(--accent); color: var(--text); }
.slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.slot .tag { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.6); color: #fff;
             font-size: 11px; padding: 1px 0; }
.slot .x { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border: 0; border-radius: 6px;
           background: rgba(0,0,0,.6); color: #fff; cursor: pointer; line-height: 1; }
.drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 16px; text-align: center;
        color: var(--dim); cursor: pointer; background: var(--stage); font-size: 14px; }
.drop.over { border-color: var(--accent); color: var(--text); }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { position: relative; width: 72px; height: 72px; border-radius: 8px; overflow: hidden;
         background: var(--stage); border: 1px solid var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border: 0;
                border-radius: 6px; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; line-height: 1; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.swatch { display: grid; gap: 2px; justify-items: center; font-size: 11px; color: var(--dim); position: relative; }
.swatch input[type="color"] { width: 40px; height: 40px; padding: 0; border: 1px solid var(--line);
                              border-radius: 8px; background: none; cursor: pointer; }
.swatch .x { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border: 0; border-radius: 50%;
             background: var(--dim); color: var(--panel); cursor: pointer; line-height: 1; font-size: 12px; }

/* the stage: what is being made */
.stage { display: grid; gap: 12px; min-width: 0; }
.stage.full { position: fixed; inset: 16px; z-index: 20; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.35);
              grid-template-rows: auto 1fr; }
body.has-full::before { content: ""; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 19; }
.stagehead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.stagehead h2 { overflow-wrap: anywhere; }
.stagehead .grow { margin-left: auto; }
.viewer { position: relative; background: var(--stage); border-radius: 10px; height: min(56vh, 520px); min-height: 280px;
          display: flex; align-items: center; justify-content: center; color: var(--dim); text-align: center;
          padding: 16px; overflow: hidden; }
.stage.full .viewer { height: auto; min-height: 60vh; }
.viewer model-viewer, .viewer > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
model-viewer { --poster-color: transparent; }
.veil { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        background: color-mix(in srgb, var(--stage) 75%, transparent); color: var(--text); z-index: 2; }
.views { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.view { margin: 0; background: var(--stage); border-radius: 10px; overflow: hidden; display: grid; }
.view img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; cursor: zoom-in; }
.view figcaption { display: flex; justify-content: space-between; align-items: center; gap: 6px;
                   padding: 6px 8px; font-size: 13px; }
.strip { display: flex; gap: 8px; flex-wrap: wrap; }
.strip img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: var(--stage); cursor: zoom-in; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.metric { background: var(--stage); border-radius: 9px; padding: 8px 10px; }
.metric small { display: block; color: var(--dim); font-size: 12px; }
.metric b { font-weight: 600; }
.metric b.ok { color: var(--ok); } .metric b.warn { color: var(--warn); }
.slotlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
.slotlist li { display: flex; gap: 8px; align-items: center; }
.slotlist i { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line); flex: none; }
.warns { margin: 0; padding-left: 18px; color: var(--warn); font-size: 13px; }
.next { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; }
.next .grow { flex: 1; min-width: 200px; }

/* jobs */
section.block { margin: 22px 0; }
.head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.head .dim { overflow-wrap: anywhere; }
.jobs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.job { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center;
       background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.job .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job .state { font-size: 13px; color: var(--dim); white-space: nowrap; }
.job .detail { grid-column: 2 / -1; font-size: 13px; color: var(--dim); overflow-wrap: anywhere; }
.job .detail.bad { color: var(--bad); }
.job .detail a { color: var(--text); }
.job .progress { grid-column: 2 / -1; display: grid; grid-template-columns: 1fr auto; gap: 3px 10px;
                 align-items: center; font-size: 13px; color: var(--dim); }
.job .track { height: 5px; border-radius: 3px; background: var(--stage); overflow: hidden; }
.job .fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .6s ease; }
.job .pct { font-variant-numeric: tabular-nums; }
.job .stagename { grid-column: 1 / -1; }
.job .from { font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 4px;
             padding: 0 4px; margin-left: 6px; }
.spin { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--warn);
        border-right-color: transparent; animation: spin 1s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } .job .fill { transition: none; } }

/* library */
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.obj { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 0;
       overflow: hidden; cursor: pointer; display: grid; }
.obj:hover { border-color: var(--dim); }
.obj[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.obj .pic { aspect-ratio: 1; background: var(--stage); display: flex; align-items: center; justify-content: center;
            color: var(--dim); font-size: 13px; }
.obj .pic img { width: 100%; height: 100%; object-fit: contain; display: block; }
.obj .cap { padding: 8px 10px 10px; display: grid; gap: 4px; }
.obj .name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badges { display: flex; gap: 4px; flex-wrap: wrap; }
.badge { font-size: 11px; font-weight: 600; color: var(--accent); border: 1px solid currentColor;
         border-radius: 4px; padding: 0 5px; }
.badge.plain { color: var(--dim); font-weight: 400; }
.empty { color: var(--dim); padding: 28px 0; text-align: center; }
.lightbox { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.8); display: flex; align-items: center;
            justify-content: center; cursor: zoom-out; padding: 24px; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }

@media (max-width: 860px) {
  .wrap { padding: 0 14px; }
  .work { grid-template-columns: minmax(0, 1fr); }
  .stagetab span { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>kami</h1>
    <div class="pod" id="pod" aria-live="polite">
      <span class="dot" id="pod-dot"></span>
      <span class="mode" id="pod-mode">Checking the pod…</span>
      <span class="chip" id="pod-profile" hidden></span>
      <span class="dim" id="pod-meta"></span>
    </div>
    <button type="button" class="btn danger" id="down" hidden>Delete pod</button>
  </div>
</header>

<main class="wrap">
  <nav class="stages" role="tablist" aria-label="Stages">
    <button type="button" class="stagetab" role="tab" data-stage="concept"><b>Concept</b><span></span></button>
    <button type="button" class="stagetab" role="tab" data-stage="mesh"><b>Mesh</b><span></span></button>
    <button type="button" class="stagetab" role="tab" data-stage="print"><b>Print</b><span></span></button>
  </nav>

  <div class="work">
    <aside class="panel controls" id="controls"></aside>
    <section class="panel stage" id="stage" aria-live="polite"></section>
  </div>

  <section class="block" id="jobs-section" hidden>
    <div class="head"><h2>Jobs</h2><span class="dim">on the pod: the running one, the queue, the last ones</span></div>
    <ul class="jobs" id="jobs"></ul>
  </section>

  <section class="block">
    <div class="head"><h2>Library</h2><span class="dim" id="folder"></span></div>
    <div class="grid" id="library"><p class="empty">Loading…</p></div>
  </section>
</main>

<script>
"use strict";
const TOKEN = document.querySelector('meta[name="kami-token"]').content;
const FOLDER = document.querySelector('meta[name="kami-folder"]').content;
const VIEW_ORDER = ["front", "left", "back", "right", "front-left", "front-right", "back-left", "back-right"];
const STAGES = ["concept", "mesh", "print"];

let pod = null;              // the last /api/state pod info
let hint = false, hintColors = 4;
let objects = [], signature = "";
let stage = null, picked = false;        // picked: the user chose a stage, stop following the pod
let current = null;          // key of the object on the stage
let meshMode = "views";      // views | each | text
const slots = {};            // view -> {file} (library) or {name, data, url} (uploaded)
const loose = [];            // pictures for "one mesh per picture"
const print = {height: 80, base: 2, mode: "auto", colors: 4, palette: [], rebuild: "auto", detail: 0.3,
               result: null, busy: false, dirty: false, error: "", forFile: null};
let controlsKey = "", stageKey = "";
const doneJobs = new Set();

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v === true) node.setAttribute(k, "");
    else node.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) node.append(kid);
  return node;
}
const fileUrl = rel => "files/" + rel.split("/").map(encodeURIComponent).join("/");
function money(x) { return typeof x === "number" ? "$" + x.toFixed(2) : "?"; }
function minutes(s) {
  s = Math.max(0, Math.round(s));
  if (s < 3600) return Math.round(s / 60) + " min";
  return Math.floor(s / 3600) + " h " + String(Math.round((s % 3600) / 60)).padStart(2, "0") + " min";
}
function size(n) { return n >= 1e5 ? (n / 1e6).toFixed(1) + " MB" : Math.round(n / 1e3) + " kB"; }
async function post(path, body) {
  const r = await fetch(path, {method: "POST", body: JSON.stringify(body),
                               headers: {"Content-Type": "application/json", "X-Kami-Token": TOKEN}});
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}
function copyButton(text) {
  const b = el("button", {type: "button", class: "btn small", text: "Copy"});
  b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(text); b.textContent = "Copied"; }
    catch (e) { b.textContent = "Select it"; }
    setTimeout(() => { b.textContent = "Copy"; }, 1500);
  });
  return b;
}
const command = text => el("div", {class: "cmd"}, el("code", {text}), copyButton(text));

/* --- the pod, and what it is for --- */
function served() { return (pod && pod.served) || {}; }
function ready() { return !!(pod && pod.pod && pod.ready); }
function can(name) {
  const s = served();
  if (name === "print") return true;
  if (!ready()) return false;
  return name === "mesh" ? !!s.mesh_model : !!(s.image_model || s.views_model);
}
function podMode() {
  const concept = can("concept"), mesh = can("mesh");
  return concept && mesh ? "Concept + mesh pod" : mesh ? "Mesh pod" : concept ? "Concept pod" : "Pod";
}
function obj() { return objects.find(o => o.key === current) || null; }
function meshOf(o) { return o && o.meshes.length ? o.meshes[0] : null; }
function frontOf(o) { return o ? (o.views.front || o.images[0] || Object.values(o.views)[0] || null) : null; }

function renderPod() {
  const dot = $("#pod-dot"), mode = $("#pod-mode"), meta = $("#pod-meta"), down = $("#down"), prof = $("#pod-profile");
  dot.className = "dot";
  meta.textContent = "";
  down.hidden = true;
  prof.hidden = true;
  const p = pod && pod.pod;
  if (!pod) { mode.textContent = "Checking the pod…"; return; }
  if (pod.error && !p) { dot.classList.add("bad"); mode.textContent = "Cannot read the pod: " + pod.error; return; }
  if (!p) {
    mode.textContent = pod.waiting ? "Waiting for GPU stock (kami up)" : "No pod";
    meta.textContent = pod.waiting ? "" : "nothing is billing";
    if (pod.waiting) dot.classList.add("busy");
    return;
  }
  down.hidden = false;
  if (p.status === "GONE") { dot.classList.add("bad"); mode.textContent = "The pod no longer exists"; return; }
  dot.classList.add(pod.ready ? "ready" : "busy");
  mode.textContent = pod.ready ? podMode() : "Pod starting";
  prof.hidden = false;
  prof.textContent = p.profile || "pod";
  const s = served(), bits = [];
  const models = [s.image_model, s.views_model, s.mesh_model].filter(Boolean).map(m => m.split("/").pop());
  if (models.length) bits.push(models.join(" + "));
  if (p.gpu) bits.push(p.gpu);
  if (typeof p.cost_per_hour === "number") bits.push(money(p.cost_per_hour) + "/h");
  if (typeof p.session_cost_estimate === "number") bits.push("≈ " + money(p.session_cost_estimate) + " so far");
  const g = p.guard || {};
  if (g.deadline) bits.push("deletes itself in " + minutes(g.deadline - Date.now() / 1000));
  if (g.idle_minutes) bits.push("or after " + g.idle_minutes + " min idle");
  meta.textContent = bits.join(" · ");
}

let armedAt = 0;
$("#down").addEventListener("click", async () => {
  const b = $("#down");
  if (Date.now() - armedAt > 4000) {          // two clicks: no browser dialog
    armedAt = Date.now();
    b.classList.add("armed");
    b.textContent = "Click again to delete it";
    setTimeout(() => { if (Date.now() - armedAt >= 4000) { b.classList.remove("armed"); b.textContent = "Delete pod"; } }, 4100);
    return;
  }
  armedAt = 0;
  b.disabled = true;
  b.textContent = "Deleting…";
  try {
    const r = await post("api/down", {});
    $("#pod-mode").textContent = "Pod " + (r.pod_id || "") + " deleted" +
      (typeof r.session_cost_estimate === "number" ? " · ≈ " + money(r.session_cost_estimate) + " this session" : "");
  } catch (e) {
    $("#pod-meta").textContent = "Could not delete it: " + e.message + " (kami down in a terminal)";
  }
  b.disabled = false;
  b.classList.remove("armed");
  b.textContent = "Delete pod";
  refresh();
});

/* --- stages --- */
function followPod() {
  // open on what the pod is for; with no pod, on the library's last mesh ready to print
  if (picked) return;
  const want = can("concept") ? "concept" : can("mesh") ? "mesh" : (stage || "print");
  if (want !== stage) setStage(want, false);
}
function setStage(name, byUser) {
  stage = name;
  if (byUser) picked = true;
  if (name === "print") queuePrint();
  render();
}
function renderStages() {
  for (const tab of $$(".stagetab")) {
    const name = tab.dataset.stage, here = can(name);
    tab.setAttribute("aria-selected", String(name === stage));
    tab.classList.toggle("here", here);
    $("span", tab).textContent = name === "print" ? "on this PC, no pod"

/* --- pictures: reading, slots --- */
const IMAGE_NAME = /\.(png|jpe?g|webp|avif|heic|heif|tiff?|bmp|gif)$/i;
const IMAGE_TYPE = /^image\/(png|jpeg|webp|avif|heic|heif|tiff|bmp|gif)$/;
function readPicture(file) {
  return new Promise((done, fail) => {
    if (!IMAGE_NAME.test(file.name) && !IMAGE_TYPE.test(file.type)) return fail(new Error(file.name + " is not a picture"));
    const reader = new FileReader();
    reader.onload = () => done({
      name: IMAGE_NAME.test(file.name) ? file.name : "pasted." + (file.type.split("/")[1] || "png").replace("jpeg", "jpg"),
      data: String(reader.result).split(",")[1], url: URL.createObjectURL(file)});
    reader.onerror = () => fail(new Error("Could not read " + file.name));
    reader.readAsDataURL(file);
  });
}
function pictureBody(p) { return p.file ? {file: p.file} : {name: p.name, data: p.data}; }
function pictureUrl(p) { return p.file ? fileUrl(p.file) : p.url; }
function slotNames() {

  if (most < 2) return ["front"];
  const names = s.view_names && s.view_names.length ? s.view_names : VIEW_ORDER;
  return VIEW_ORDER.filter(n => names.includes(n)).concat(names.filter(n => !VIEW_ORDER.includes(n))).slice(0, most);
}
function fillSlots(o) {

  if (!slots.front && o.images[0]) slots.front = {file: o.images[0]};

}
function pickFile(multiple, then) {
  const input = el("input", {type: "file", accept: ".png,.jpg,.jpeg,.webp,.avif,.heic,.heif,.tif,.tiff,.bmp,.gif",
                             multiple: multiple});

    for (const f of input.files) { try { then(await readPicture(f)); } catch (e) {} }

}
function renderSlots() {

    const p = slots[name];

                            title: p ? "Replace the " + name + " view" : "Add the " + name + " view"});
    const put = pic => { slots[name] = pic; renderSlots(); };
    slot.addEventListener("click", e => { if (!e.target.closest(".x")) pickFile(false, put); });
    slot.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pickFile(false, put); } });
    slot.addEventListener("dragover", e => { e.preventDefault(); slot.classList.add("over"); });
    slot.addEventListener("dragleave", () => slot.classList.remove("over"));

    });

    .map(([v, t]) => new Option(t, v, false, v === print.rebuild)));
  form.append(el("details", {}, el("summary", {text: "Advanced"}), el("div", {class: "row"}, field("Rebuild the surface", rebuild),
    field("Detail (mm)", number("detail", "", {min: "0.1", max: "2", step: "0.05", value: String(print.detail)})))));
  form.append(el("div", {class: "actions"},
    el("button", {type: "submit", class: "btn primary", id: "print-save", text: "Save 3MF"})),
    el("div", {class: "notice", "data-notice": "", id: "print-notice"}));
  form.addEventListener("change", () => {
    print.height = num(form, "height") || print.height;
    print.base = num(form, "base") ?? print.base;
    if (form.elements.colors) print.colors = num(form, "colors") || print.colors;
    print.rebuild = form.elements.rebuild.value;
    print.detail = num(form, "detail") || print.detail;
    queuePrint();
  });
  form.addEventListener("submit", e => { e.preventDefault(); runPrint(true); });
  return form;
}
let printTimer = 0;
function queuePrint() {
  clearTimeout(printTimer);
  printTimer = setTimeout(() => runPrint(false), 350);
}
async function runPrint(save) {
  const mesh = meshOf(obj());
  if (stage !== "print" || !mesh) return;
  if (print.busy) { print.dirty = true; return; }
  print.busy = true;
  print.error = "";
  stageKey = ""; renderStage();
  const body = {file: mesh.file, height: print.height, base: print.base, rebuild: print.rebuild, detail: print.detail, save};
  if (print.mode === "mine") body.palette = print.palette; else body.colors = print.colors;
  try {
    print.result = await post("api/print", body);
    print.forFile = mesh.file;
    if (save && print.result.saved) refreshObjects(true);
  } catch (e) {
    print.error = e.message;
  }
  print.busy = false;
  stageKey = ""; renderStage();
  const notice = $("#print-notice");
  if (notice && save) {
    notice.className = "notice" + (print.error ? " bad" : "");
    notice.textContent = print.error || ("Saved " + print.result.saved + ": open it in Bambu Studio");
  }
  if (print.dirty) { print.dirty = false; runPrint(false); }
}
function printStage(box) {
  const o = obj(), mesh = meshOf(o);
  if (!mesh) {
    box.append(el("div", {class: "viewer"}, el("p", {text: o ? "This object has no mesh yet: there is nothing to print."
      : "Pick an object with a mesh in the library below. Preparing it for print runs on this PC: no pod, nothing billed."})));
    return;
  }
  const r = print.forFile === mesh.file ? print.result : null;
  const stageBox = el("div", {class: "viewer"});
  if (r) stageBox.append(viewer(r.preview, o.name + ", painted"));
  if (print.busy) stageBox.append(el("div", {class: "veil"}, el("span", {}, el("span", {class: "spin", style: "display:inline-block;margin-right:8px"}),
    r ? "Updating…" : "Making it a solid on the plate…")));
  else if (print.error) stageBox.append(el("div", {class: "veil"}, el("span", {class: "notice bad", text: print.error})));
  else if (!r) stageBox.append(el("p", {text: "Preparing…"}));
  box.append(stageBox);
  if (!r) return;
  const solid = r.closed ? "closed" + (r.rebuilt ? ", rebuilt" : "") : "not closed";
  box.append(el("div", {class: "metrics"},
    el("div", {class: "metric"}, el("small", {text: "Solid"}), el("b", {class: r.closed ? "ok" : "warn", text: solid})),
    el("div", {class: "metric"}, el("small", {text: "Size (mm)"}), el("b", {text: r.size.join(" × ")})),
    el("div", {class: "metric"}, el("small", {text: "Flat base"}), el("b", {text: r.base_area.toLocaleString() + " mm²"})),
    el("div", {class: "metric"}, el("small", {text: "Triangles"}), el("b", {text: r.triangles.toLocaleString()}))));
  box.append(el("ul", {class: "slotlist"}, r.colors.map((c, i) => el("li", {},
    el("i", {style: "background:" + c.hex}), "Slot " + (i + 1) + " · " + c.hex + " · " + Math.round(c.share * 100) + "% of the surface"))));
  const notes = r.warnings.slice();
  if (r.rebuilt) notes.unshift("The surface was rebuilt to close it: detail under " + r.detail.toFixed(2) + " mm is lost");
  if (notes.length) box.append(el("ul", {class: "warns"}, notes.map(w => el("li", {text: w.replace(/`/g, "")}))));
  if (o.prints.length) {
    box.append(el("div", {class: "next"}, el("span", {class: "grow dim"}, "Saved: ",
      o.prints.map((p, i) => [i ? ", " : "", el("a", {href: fileUrl(p.file), download: "", text: p.file})]),
      ". Give filaments 1 to " + r.colors.length + " these colours in the slicer.")));
  }
}

/* --- rendering --- */
function renderControls() {
  const s = served();
  const key = [stage, ready(), can(stage), meshMode, hint, print.mode, print.palette.length, JSON.stringify(s),
               stage === "concept" ? (frontOf(obj()) || "") : "", pod && pod.pod ? pod.pod.profile : ""].join("|");
  if (key === controlsKey) return;
  controlsKey = key;
  const box = $("#controls");
  box.innerHTML = "";
  if (stage === "print") box.append(printControls());
  else if (!can(stage)) box.append(blocked(stage));
  else box.append(stage === "mesh" ? meshControls() : conceptControls());
  renderSlots();
  renderLoose();
}
function renderStage() {
  const o = obj();
  const key = [stage, current, o ? o.mtime : 0, can("mesh"), can("concept"), print.busy, print.error,
               print.result && print.result.preview, print.forFile].join("|");
  if (key === stageKey) return;
  stageKey = key;
  const box = $("#stage");
  const full = box.classList.contains("full");
  box.innerHTML = "";
  const head = el("div", {class: "stagehead"}, el("h2", {text: o ? o.name : "Nothing on the stage"}));
  if (o && o.folder) head.append(el("span", {class: "chip", text: o.folder}));
  head.append(el("button", {type: "button", class: "btn small grow", text: full ? "Close" : "Full size", onclick: () => {
    const on = box.classList.toggle("full");
    document.body.classList.toggle("has-full", on);
    stageKey = ""; renderStage();
  }}));
  box.append(head);
  if (stage === "concept") conceptStage(box);
  else if (stage === "mesh") meshStage(box);
  else printStage(box);
}
function renderLibrary() {
  const box = $("#library");
  box.innerHTML = "";
  $("#folder").textContent = FOLDER;
  if (!objects.length) {
    box.append(el("p", {class: "empty", text: "Nothing yet. What you make here, or with kami in a terminal, shows up as objects."}));
    return;
  }
  for (const o of objects) {
    const pic = frontOf(o), views = Object.keys(o.views).length;
    const card = el("button", {type: "button", class: "obj", "aria-pressed": String(o.key === current), title: o.key});
    const face = el("div", {class: "pic"});
    if (pic) face.append(el("img", {src: fileUrl(pic), alt: "", loading: "lazy"}));
    else if (meshOf(o)) {
      // a mesh with no picture of its own: kami draws one (needs numpy on this PC)
      const drawn = el("img", {src: "thumbs/" + meshOf(o).file.split("/").map(encodeURIComponent).join("/"), alt: "", loading: "lazy"});
      drawn.addEventListener("error", () => drawn.replaceWith("mesh"));
      face.append(drawn);
    } else face.append("3MF");
    card.append(face,
      el("div", {class: "cap"}, el("span", {class: "name", text: o.name}), el("div", {class: "badges"},
        views ? el("span", {class: "badge plain", text: views + (views > 1 ? " views" : " view")}) : null,
        !views && o.images.length ? el("span", {class: "badge plain", text: "picture"}) : null,
        o.meshes.length ? el("span", {class: "badge", text: "mesh"}) : null,
        o.prints.length ? el("span", {class: "badge", text: "3MF"}) : null,
        o.folder ? el("span", {class: "badge plain", text: o.folder}) : null)));
    card.addEventListener("click", () => select(o.key, true));
    box.append(card);
  }
}
function select(key, byUser) {
  current = key;
  const o = obj();
  fillSlots(o);
  if (byUser && o) {
    picked = true;
    if (meshOf(o)) { if (stage === "concept") stage = "mesh"; }
    else if (stage === "print" || (stage === "mesh" && !can("mesh"))) stage = "concept";
    window.scrollTo({top: 0, behavior: "smooth"});
  }
  if (stage === "print") queuePrint();
  render();
}
function render() {
  if (!stage) return;
  renderStages();
  renderControls();
  renderStage();
  $$(".obj").forEach(c => c.setAttribute("aria-pressed", String(c.title === current)));
}
function lightbox(file) {
  const box = el("div", {class: "lightbox", role: "dialog", "aria-label": file}, el("img", {src: fileUrl(file), alt: file}));
  box.addEventListener("click", () => box.remove());
  document.body.append(box);
}
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  $$(".lightbox").forEach(b => b.remove());
  if ($("#stage").classList.contains("full")) {
    $("#stage").classList.remove("full");
    document.body.classList.remove("has-full");
    stageKey = ""; renderStage();
  }
});
document.addEventListener("paste", async e => {
  if (stage !== "mesh" || !can("mesh")) return;
  const files = [...(e.clipboardData || {}).items || []].filter(i => i.kind === "file").map(i => i.getAsFile());
  for (const f of files) {
    try {
      const pic = await readPicture(f);
      if (meshMode === "views") { slots[slotNames().find(n => !slots[n]) || "front"] = pic; renderSlots(); }
      else if (meshMode === "each") { loose.push(pic); renderLoose(); }
    } catch (err) {}
  }
});

/* --- jobs --- */
const STATE_TEXT = {sending: "sending", queued: "queued", running: "on the GPU",
                    downloading: "downloading", done: "done", error: "failed"};
function objectOfFile(file) {
  return objects.find(o => Object.values(o.views).includes(file) || o.images.includes(file) ||
                           o.meshes.some(m => m.file === file) || o.prints.some(p => p.file === file));
}
function renderJobs(list) {
  $("#jobs-section").hidden = !list.length;
  const ul = $("#jobs");
  ul.innerHTML = "";
  for (const j of list) {
    const li = el("li", {class: "job"});
    const mark = el("span", {class: j.status === "done" ? "dot ready" : j.status === "error" ? "dot bad" : "spin"});
    const label = el("span", {class: "label", text: j.label, title: j.label});
    if (j.external) label.append(el("span", {class: "from", text: "terminal",
      title: "Sent from a terminal or another kami ui; that one downloads its files"}));
    let text = STATE_TEXT[j.status] || j.status;
    if (j.status === "queued" && j.position) text += " #" + j.position;
    const end = j.finished || Date.now() / 1000;
    li.append(mark, label, el("span", {class: "state", text: text + (j.created ? " · " + Math.max(0, Math.round(end - j.created)) + " s" : "")}));
    if (j.status === "running" && typeof j.progress === "number") {
      const pct = Math.round(Math.min(1, Math.max(0, j.progress)) * 100);
      li.append(el("div", {class: "progress"},
        el("div", {class: "track", role: "progressbar", "aria-valuenow": String(pct), "aria-valuemin": "0", "aria-valuemax": "100"},
           el("div", {class: "fill", style: "width:" + pct + "%"})),
        el("span", {class: "pct", text: pct + "%"}),
        el("span", {class: "stagename", text: (j.stage_label || "On the GPU") + (j.steps ? " · step " + j.step + "/" + j.steps : "")})));
    }
    const local = (j.files || []).filter(f => objectOfFile(f));
    if (j.error) li.append(el("span", {class: "detail bad", text: j.error}));
    else if (local.length) {
      const detail = el("span", {class: "detail"});
      local.forEach((f, i) => {
        if (i) detail.append(", ");
        detail.append(el("a", {href: fileUrl(f), text: f, title: "Put it on the stage",
          onclick: e => { e.preventDefault(); const o = objectOfFile(f); if (o) select(o.key, true); }}));
      });
      li.append(detail);
    }
    ul.append(li);
  }
}
function followJobs(list) {
  // what this page asked for goes on the stage when it arrives
  for (const j of list) {
    if (j.external || j.status !== "done" || doneJobs.has(j.id) || !(j.files || []).length) continue;
    const o = objectOfFile(j.files.find(f => /\.glb$/i.test(f)) || j.files[0]);
    if (!o) continue;                 // the library has not caught up yet: next round
    doneJobs.add(j.id);
    if ($("#stage").classList.contains("full")) continue;
    current = o.key;
    fillSlots(o);
    if (meshOf(o) && stage === "concept" && j.kind !== "views" && j.kind !== "image") stage = "mesh";
    render();
  }
}

/* --- polling --- */
async function refreshObjects(force) {
  const r = await fetch("api/objects", {cache: "no-store"});
  if (!r.ok) return;
  const data = await r.json();
  objects = data.objects || [];
  signature = data.signature;
  if (current && !obj()) current = null;
  if (!current && objects.length) {
    // the newest thing made that the open stage can show
    const first = (stage === "print" ? objects.find(o => meshOf(o)) : null) || objects[0];
    current = first.key;
    fillSlots(first);
    if (stage === "print") queuePrint();
  }
  renderLibrary();
  render();
}
let busy = false, first = true;
async function refresh() {
  if (busy) return;
  busy = true;
  try {
    const r = await fetch("api/state", {cache: "no-store"});
    if (r.ok) {
      const s = await r.json();
      pod = s.pod;
      hint = !!s.print_hint;
      hintColors = s.print_colors || 4;
      if (first) { print.colors = hintColors; first = false; }
      renderPod();
      followPod();
      if (!stage) setStage("print", false);
      if (s.signature !== signature) await refreshObjects();
      renderJobs(s.jobs || []);
      followJobs(s.jobs || []);
      render();
    }
  } catch (e) {
    $("#pod-mode").textContent = "kami ui stopped (run it again in a terminal)";
    $("#pod-dot").className = "dot bad";
  } finally {
    busy = false;
  }
}
refresh();
setInterval(refresh, 3000);
</script>
