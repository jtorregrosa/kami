# Builds docker/Dockerfile and pushes it to GitHub's registry as
# ghcr.io/<owner>/kami-server:<tag>. Run it by hand (Actions -> server image -> Run
# workflow) or push a tag like server-0.1.0. Then set `container` in kami.toml, and make
# the package public (or give RunPod / vast.ai registry credentials) so pods can pull it.
name: server image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        default: "0.1.0"
      variant:
        description: "base (docker/Dockerfile) or hunyuan (docker/Dockerfile.hunyuan, on top of base:<tag>, tagged <tag>-hunyuan)"
        type: choice
        options: [base, hunyuan]
        default: base
  push:
    tags: ["server-*"]

permissions:
  contents: read
  packages: write

# one build per tag at a time; a second run of the same tag waits instead of racing
concurrency:
  group: server-image-${{ inputs.tag || github.ref_name }}-${{ inputs.variant || 'base' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # the CUDA devel base image and the build need more than the runner's free disk
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME#server-}" >> "$GITHUB_OUTPUT"
          fi
          # registry names must be lower case
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Variant
        id: variant
        run: |
          if [ "${{ inputs.variant }}" = "hunyuan" ]; then
            echo "file=docker/Dockerfile.hunyuan" >> "$GITHUB_OUTPUT"
            echo "suffix=-hunyuan" >> "$GITHUB_OUTPUT"
          else
            echo "file=docker/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker
          file: ${{ steps.variant.outputs.file }}
          # the hunyuan variant builds on the base image of the same tag
          build-args: BASE=ghcr.io/${{ steps.tag.outputs.owner }}/kami-server:${{ steps.tag.outputs.tag }}
          push: true
          tags: ghcr.io/${{ steps.tag.outputs.owner }}/kami-server:${{ steps.tag.outputs.tag }}${{ steps.variant.outputs.suffix }}
          # the base keeps the default cache scope (its existing cache); hunyuan has its own
          cache-from: type=gha${{ inputs.variant == 'hunyuan' && ',scope=hunyuan' || '' }}
          # the image is bigger than the Actions cache: a failed cache export must not
          # fail a build whose image was already pushed
          cache-to: type=gha,mode=max,ignore-error=true${{ inputs.variant == 'hunyuan' && ',scope=hunyuan' || '' }}
