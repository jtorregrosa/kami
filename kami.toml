# kami configuration. Secrets (RUNPOD_API_KEY, VAST_API_KEY, HF_TOKEN) live in .env, not here.
#
# Each profile names the models the pod loads and the GPUs to try, in order, until one has
# stock. GPUs are named the same on every provider (`kami gpus` shows names and stock).
#
# The server image is built with CUDA 12.4 for Ampere / Ada / Hopper (sm 80-90), what
# TRELLIS.2's CUDA extensions are tested on: Blackwell cards (RTX 5090, RTX PRO 6000,
# B200) are left out of the profiles until the image is rebuilt for CUDA 12.8.

[defaults]
profile = "mesh"
# Where pods run: "runpod" or "vast" (vast.ai). `kami up --provider vast` overrides it.
provider = "runpod"
# The kami-server image: build docker/Dockerfile and push it (README: Build the server
# image) with .github/workflows/server-image.yml; the package must be public.
container = "ghcr.io/jtorregrosa/kami-server:0.1.0"
# "ephemeral": weights downloaded on every `kami up` (no fixed cost).
# "volume": persistent network volume (fast boots, ~$0.07/GB/month, pinned datacenter).
storage = "ephemeral"
# Empty = any datacenter with stock (required with a volume). See `kami gpus`.
datacenter = ""
volume_name = "kami-models"
volume_size_gb = 100
# SECURE: RunPod's own datacenters / vast.ai's datacenter hosts. COMMUNITY: cheaper hosts.
cloud = "SECURE"
port = 8000
# Where `kami mesh` / `kami image` save what they make (relative to the current directory).
output_dir = "kami-out"
# Prompts get a hint added so the picture is of something to print. print_preset picks
# which: figure (a vinyl toy on its base, the default), flexi (a creature lying flat and
# whole, for joints cut afterwards), lowpoly, bust, relief, natural. Or write your own in
# print_hint ({colors} becomes the number of filaments), "" for prompts exactly as written.
# print_preset = "figure"
# print_hint = "..."
# The pod deletes itself after max_hours of uptime, or after idle_minutes without jobs,
# even if your PC is off. 0 disables each. Override with `kami up --max-hours / --idle`.
max_hours = 4
idle_minutes = 30

# Two profiles, one per pod of the way from a concept to a print (`kami ui` shows them
# as its Concept and Mesh stages; Print runs on your PC):
#
#   kami up -p fronts-flux   a description -> pictures of the object's front (FLUX.2)
#   kami up -p views         a picture of the front -> its sides
#   kami up -p mesh          those pictures -> a textured mesh (GLB)
#
# The other profiles kami can run are at the end of this file, commented out.

# views: Qwen-Image-Edit-2511 (20B, Apache-2.0) with fal's Multiple-Angles LoRA (96 camera
# poses, Apache-2.0) turns the camera around a picture of the front (left, back, right,
# and the diagonals): `kami views --front picture.png`, "Views" in kami ui. Qwen-Edit in
# bf16 is ~57 GB: an 80 GB card.
#
# It can make the front itself too, with Z-Image-Turbo (6B, Apache-2.0; 8 steps, a few
# seconds), for `kami views "a ceramic owl"` in one go: the two models take turns on the
# card (offload). Turbo keeps the subject but pays little attention to pose and camera;
# the fronts worth keeping come from fronts-flux, below.
#
# The full Z-Image (image_model = "Tongyi-MAI/Z-Image", image_defaults = { steps = 32,
# guidance = 4.0, width = 1024, height = 1024 }) was tried in its place: it obeys the pose
# and reads the negative prompt, but draws the hint over the subject (a snake as a
# sausage) at 32 s a picture. Kept here as the note of what was tried.
[profiles.views]
image_model = "Tongyi-MAI/Z-Image-Turbo"
image_defaults = { steps = 8, guidance = 0.0, width = 1024, height = 1024 }
views_model = "Qwen/Qwen-Image-Edit-2511"
views_lora = "fal/Qwen-Image-Edit-2511-Multiple-Angles-LoRA/qwen-image-edit-2511-multiple-angles-lora.safetensors"
views_defaults = { steps = 40, guidance = 4.0, lora_scale = 0.9 }
offload = true
gpus = ["A100 SXM 80GB", "A100 PCIe 80GB", "H100 PCIe", "H100 SXM", "H100 NVL"]
min_vram_gb = 80
min_ram_gb = 96          # both models wait in RAM between turns
disk_gb = 140

# mesh: Pixal3D (TencentARC, MIT, SIGGRAPH 2026), TRELLIS.2 with pixel-aligned
# conditioning: one picture, or posed views of one object with weights trained for them
# (`kami mesh front=a.png left=b.png back=c.png right=d.png`, as `kami views` saves
# them; also front-left, back-right...). ~18 GB on the GPU; its single-view and posed-
# view pipelines both wait in RAM. Runs on the -pixal3d image (variant = pixal3d).
# It also loads DINOv3 and RMBG-2.0, both gated: accept their terms on Hugging Face with
# the account of HF_TOKEN (`kami doctor` checks it).
[profiles.mesh]
mesh_model = "TencentARC/Pixal3D"
container = "ghcr.io/jtorregrosa/kami-server:0.1.0-pixal3d"
gpus = ["RTX 4090", "L40S", "RTX A6000", "L40", "A100 PCIe 80GB"]
min_vram_gb = 24
min_ram_gb = 64          # both pipelines in RAM
disk_gb = 80
mesh_defaults = { texture_size = 2048, decimation_target = 500000, remesh = true }

# fronts-flux: FLUX.2 [dev] (Black Forest Labs, 32B; NON-COMMERCIAL licence) for the front
# picture: `kami image "..."`, or "Make pictures" in kami ui's Concept stage. Of the three
# front models tried it is the one that keeps the subject itself (a snake a snake) while
# laying it down, facing the camera, in its own colours; ~1 min a picture on an L40S.
# Its 4-bit build fits a 48 GB card, but not the 80 GB one next to Qwen-Image-Edit (its
# quantised parts stay on the GPU, ~32 GB, and Qwen needs ~57), so it is a pod of its
# own: make the fronts here, `kami down`, then `kami up -p views` and turn the chosen one
# in the Views stage (`kami views --front picture.png`).
[profiles.fronts-flux]
image_model = "diffusers/FLUX.2-dev-bnb-4bit"
image_defaults = { steps = 28, guidance = 4.0, width = 1024, height = 1024 }
gpus = ["L40S", "RTX A6000", "L40", "RTX 6000 Ada", "A100 PCIe 80GB"]
min_vram_gb = 48
min_ram_gb = 64
disk_gb = 60           # ~34 GB of weights


# ---------------------------------------------------------------------------------------
# Other profiles, off: remove the "# " of a block to use it (`kami up -p <name>`).
# ---------------------------------------------------------------------------------------

# trellis: image -> textured GLB with TRELLIS.2 (4B, MIT), what Pixal3D is built on. One
# picture, or several views through an experimental trick. The README asks for 24 GB.
# TRELLIS.2 keeps its ~16 GB of models in RAM between steps: a 4090 host with 29 GB ran
# out of memory while making a mesh, hence min_ram_gb.
#
# [profiles.trellis]
# mesh_model = "microsoft/TRELLIS.2-4B"
# gpus = ["RTX 4090", "L40S", "RTX A6000", "L40", "A100 PCIe 80GB"]
# min_vram_gb = 24
# min_ram_gb = 48
# disk_gb = 60
# mesh_defaults = { texture_size = 2048, decimation_target = 500000, remesh = true }

# image: text -> image alone with Z-Image-Turbo: 8 steps, no guidance, a 24 GB card.
# Cheaper than `views` to try many fronts, but it cannot turn the camera.
#
# [profiles.image]
# image_model = "Tongyi-MAI/Z-Image-Turbo"
# gpus = ["RTX 4090", "RTX A5000", "L40S", "RTX A6000"]
# min_vram_gb = 24
# disk_gb = 60
# image_defaults = { steps = 8, guidance = 0.0, width = 1024, height = 1024 }

# studio: TRELLIS.2 and Z-Image-Turbo on one 48 GB card, for `kami mesh --prompt "..."`
# (text -> image -> mesh, from a single view). Needs the trellis profile above.
#
# [profiles.studio]
# extends = "trellis"
# image_model = "Tongyi-MAI/Z-Image-Turbo"
# image_defaults = { steps = 8, guidance = 0.0, width = 1024, height = 1024 }
# gpus = ["L40S", "RTX A6000", "L40", "RTX 6000 Ada", "A100 PCIe 80GB"]
# min_vram_gb = 48
# min_ram_gb = 64          # both models
# disk_gb = 100

# studio-24: the same on a 24 GB card: the model not in use waits on the CPU (offload),
# so each switch between images and meshes costs some seconds. Needs studio.
#
# [profiles.studio-24]
# extends = "studio"
# gpus = ["RTX 4090", "RTX A5000"]
# min_vram_gb = 24
# offload = true           # both models wait in RAM: min_ram_gb 64 from studio

# Hunyuan3D-2 (Tencent): image -> textured GLB, and Hunyuan3D-2mv for several named views
# of one object. Its licence (Tencent Hunyuan Community) does NOT apply in the European
# Union, the United Kingdom and South Korea: read
# https://huggingface.co/tencent/Hunyuan3D-2/blob/main/LICENSE before enabling. kami
# refuses these profiles until accept_hunyuan_license = true. They run on the -hunyuan
# image (the workflow's variant = hunyuan builds it).
#
# [profiles.hunyuan]
# mesh_model = "tencent/Hunyuan3D-2"
# accept_hunyuan_license = true
# container = "ghcr.io/jtorregrosa/kami-server:0.1.0-hunyuan"
# gpus = ["RTX 4090", "L40S", "RTX A6000", "L40"]
# min_vram_gb = 24
# min_ram_gb = 48
# disk_gb = 80
# # steps / octree_resolution / guidance of the shape model; faces kept before texturing
# mesh_defaults = { steps = 50, octree_resolution = 380, guidance = 5.0, decimation_target = 40000 }
#
# [profiles.hunyuan-mv]
# extends = "hunyuan"
# mesh_model = "tencent/Hunyuan3D-2mv"

# views-flux: FLUX.2 [dev] makes the front and turns it, with lovis93's Multi-Angles LoRA
# v2 (72 camera poses, OpenRAIL-M). FLUX.2 [dev] is NON-COMMERCIAL (FLUX [dev] licence).
# Tried on an L40: a fine front, but the LoRA barely acts through diffusers, even at
# lora_scale 3: left and back came out as the front. The NF4 (4-bit) repo fits a 48 GB
# card; for full bf16 use views_model = "black-forest-labs/FLUX.2-dev" (gated) on 80 GB.
#
# [profiles.views-flux]
# views_model = "diffusers/FLUX.2-dev-bnb-4bit"
# views_lora = "lovis93/Flux-2-Multi-Angles-LoRA-v2/flux-multi-angles-v2-72poses-fal.safetensors"
# views_defaults = { steps = 28, guidance = 4.0, lora_scale = 0.9 }
# gpus = ["L40S", "RTX A6000", "L40", "RTX 6000 Ada", "A100 PCIe 80GB"]
# min_vram_gb = 48
# min_ram_gb = 64
# disk_gb = 60           # ~34 GB of weights
